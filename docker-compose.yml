services:
  # --- Database ---
  db:
    image: mysql:8.0
    container_name: wappen-db-dev
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER:     ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      retries: 5

  # --- Backend (Spring Boot + DevTools) ---
  backend:
    build:
      context: ./be-wappen-mall
      dockerfile: Dockerfile.dev
    # ← 전체 프로젝트를 /app 에 바인드
    volumes:
      - ./be-wappen-mall:/app:delegated
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "8080:8080"
    entrypoint: ["./entrypoint.sh"]
    user: root
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL:               jdbc:mysql://db:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME:          ${DB_USER}
      SPRING_DATASOURCE_PASSWORD:          ${DB_PASS}
      SPRING_JPA_DATABASE_PLATFORM:        org.hibernate.dialect.MySQL8Dialect
      SPRING_DEVTOOLS_COMPOSE_ENABLED:     "true"
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 500
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 400
    depends_on:
      db:
        condition: service_healthy

  # --- Frontend (Vite) ---
  frontend:
    build:
      context: ./fe-wappen-mall
      dockerfile: Dockerfile.dev
    container_name: wappen-fe-dev
    command: yarn dev --host 0.0.0.0
    volumes:
      - ./fe-wappen-mall:/app:delegated       # 소스 코드
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  db-data:
    name: wappen-db-data-dev
  gradle-cache:
    name: wappen-be-gradle-cache-dev
